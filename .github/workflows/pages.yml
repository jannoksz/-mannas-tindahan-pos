name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Replace API placeholder
        run: |
          if [ -n "${{ secrets.FRONTEND_API_URL }}" ]; then
            sed -i "s|__API_URL__|${{ secrets.FRONTEND_API_URL }}|g" index.html
          else
            echo "Warning: FRONTEND_API_URL secret is not set — index.html will contain placeholder.";
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v1
        with:
          path: ./

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v1
